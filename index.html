<!doctype html>
<html lang="en">
<head>
<meta name="theme-color" content="#111827">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chinnu's Adventure</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#111827;color:white;font-family:Arial,sans-serif;display:flex;justify-content:center;min-height:100vh}
  .wrap{width:min(1100px,100%);padding:14px}
  h1{text-align:center;margin:4px 0 10px;font-size:26px}
  .gamebox{position:relative;width:100%;aspect-ratio:16/9;background:#75c9ff;border:4px solid #fff;border-radius:14px;overflow:hidden;box-shadow:0 12px 35px #0008}
  canvas{width:100%;height:100%;display:block}
  .hud{position:absolute;left:14px;top:10px;font-weight:700;font-size:18px;text-shadow:2px 2px #000}
  .help{position:absolute;right:14px;top:10px;font-size:14px;text-shadow:2px 2px #000}
  .msg{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#0008;text-align:center}
  .panel{background:#172033;border:2px solid #fff;border-radius:16px;padding:25px;max-width:90%}
  button{border:0;border-radius:10px;padding:12px 18px;font-weight:700;font-size:16px;cursor:pointer}
  .controls{display:flex;gap:10px;justify-content:center;margin-top:10px;flex-wrap:wrap}
  .note{margin:10px 0 0;color:#dbeafe;font-size:14px;text-align:center}
  code{background:#0b1220;padding:2px 5px;border-radius:4px}

  html,body{width:100%;height:100%;overflow:hidden}
  body{background:#000}
  .wrap{width:100%;height:100%;padding:0}
  h1{display:none}
  .gamebox{width:100vw;height:100vh;aspect-ratio:auto;border:0;border-radius:0;box-shadow:none}
  canvas{width:100%;height:100%;object-fit:cover}
  .hud{left:10px;top:8px;font-size:16px}
  .help{right:10px;top:8px;font-size:11px}
  .note,.controls{display:none}
  .touch-controls{position:fixed;left:0;right:0;bottom:18px;height:120px;pointer-events:none;z-index:20}
  .touch{position:absolute;pointer-events:auto;width:82px;height:82px;border-radius:50%;
         border:3px solid #fff;background:#111b;color:#fff;font-size:38px;
         box-shadow:0 4px 12px #0008;touch-action:none;user-select:none;-webkit-user-select:none}
  .touch:active{transform:scale(.92);background:#333e}
  .left{left:18px}.right{left:116px}.jump{right:20px}
  @media (orientation:portrait){
    .help{display:none}
    .touch-controls{bottom:12px}
    .touch{width:74px;height:74px;font-size:32px}
    .left{left:12px}.right{left:98px}.jump{right:12px}
  }
  @media (min-width:700px) and (orientation:landscape){
    .touch{width:92px;height:92px}
    .left{left:25px}.right{left:135px}.jump{right:28px}
  }
</style>
</head>
<body>
<div class="wrap">
<h1>⭐ Chinnu's Adventure ⭐</h1>
<div class="gamebox">
  <canvas id="game" width="1280" height="720"></canvas>
  <div class="hud" id="hud"></div>
  <div class="help">Touch controls enabled • Landscape mode recommended</div>
  <div class="msg" id="message">
    <div class="panel">
      <h2 id="msgTitle"></h2>
      <p id="msgText"></p>
      <button onclick="restart()">Play Again</button>
    </div>
  </div>
</div>
<div class="touch-controls">
  <button id="leftBtn" class="touch left">◀</button>
  <button id="jumpBtn" class="touch jump">⬆</button>
  <button id="rightBtn" class="touch right">▶</button>
</div>
<p class="note">Your supplied character image is used as the hero. Put your own <code>jump_sound.mp3</code> beside this HTML file to use your real jump recording.</p>
</div>

<script>
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");
const W=canvas.width,H=canvas.height;
const keys={};
let score=0,coins=0,lives=3,gameOver=false,won=false;
let cameraX=0;
const character=new Image(); character.src="character.png";

const worldW=5200;
const player={x:140,y:470,w:82,h:120,vx:0,vy:0,onGround:false,dir:1};
const platforms=[
 {x:0,y:610,w:850,h:110},{x:980,y:570,w:420,h:150},{x:1510,y:500,w:480,h:220},
 {x:2110,y:590,w:500,h:130},{x:2740,y:520,w:470,h:200},{x:3340,y:610,w:500,h:110},
 {x:3970,y:540,w:450,h:180},{x:4570,y:470,w:560,h:250},
 {x:540,y:470,w:190,h:24},{x:1160,y:430,w:170,h:24},{x:1710,y:370,w:180,h:24},
 {x:2320,y:450,w:170,h:24},{x:2920,y:380,w:180,h:24},{x:3550,y:450,w:180,h:24},
 {x:4120,y:390,w:180,h:24}
];
const coinsList=[
 [300,540],[430,540],[560,400],[680,400],[1100,500],[1230,360],
 [1580,430],[1740,300],[1880,430],[2200,520],[2370,380],[2520,520],
 [2820,450],[2980,310],[3120,450],[3420,540],[3600,380],[3740,540],
 [4040,470],[4190,320],[4330,470],[4700,400],[4860,400],[5020,400]
].map(([x,y])=>({x,y,r:16,taken:false}));
const enemies=[
 {x:720,y:565,w:42,h:45,vx:-1.2,min:650,max:820},
 {x:1260,y:525,w:42,h:45,vx:1.1,min:1030,max:1360},
 {x:1840,y:455,w:42,h:45,vx:-1.3,min:1550,max:1970},
 {x:2460,y:545,w:42,h:45,vx:1.4,min:2150,max:2570},
 {x:3050,y:475,w:42,h:45,vx:-1.3,min:2760,max:3160},
 {x:3660,y:565,w:42,h:45,vx:1.2,min:3370,max:3800},
 {x:4270,y:495,w:42,h:45,vx:-1.3,min:4000,max:4380}
];
const goal={x:5030,y:340,w:20,h:130};

let jumpSound=null;
function loadJumpSound(){
  jumpSound=new Audio("jump_sound.mp3");
  jumpSound.preload="auto";
}
loadJumpSound();

function playJumpSound(){
  if(jumpSound){
    try{jumpSound.currentTime=0;jumpSound.play().catch(()=>{});return;}catch(e){}
  }
  // Fallback tone so jumping still has sound before the user's MP3 is added.
  const AC=window.AudioContext||window.webkitAudioContext;
  if(AC){
    const ac=new AC(),o=ac.createOscillator(),g=ac.createGain();
    o.frequency.setValueAtTime(420,ac.currentTime);
    o.frequency.exponentialRampToValueAtTime(700,ac.currentTime+.12);
    g.gain.setValueAtTime(.08,ac.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.16);
    o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+.16);
  }
}
function jump(){
  if(!gameOver&&!won&&player.onGround){player.vy=-17;player.onGround=false;playJumpSound();}
}
function moveLeft(){keys["ArrowLeft"]=true;setTimeout(()=>keys["ArrowLeft"]=false,180)}
function moveRight(){keys["ArrowRight"]=true;setTimeout(()=>keys["ArrowRight"]=false,180)}
addEventListener("keydown",e=>{
  keys[e.key]=true;
  if([" ","ArrowUp","ArrowLeft","ArrowRight"].includes(e.key))e.preventDefault();
  if((e.key===" "||e.key==="ArrowUp"||e.key==="w"||e.key==="W")&&!e.repeat)jump();
});
addEventListener("keyup",e=>keys[e.key]=false);

function rects(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function resetPlayer(){player.x=140;player.y=470;player.vx=0;player.vy=0;cameraX=0}
function loseLife(){
  lives--;
  if(lives<=0){gameOver=true;showMsg("GAME OVER","You ran out of lives.");}
  else resetPlayer();
}
function showMsg(title,text){document.getElementById("msgTitle").textContent=title;document.getElementById("msgText").textContent=text;document.getElementById("message").style.display="flex"}
function restart(){
  score=0;coins=0;lives=3;gameOver=false;won=false;
  coinsList.forEach(c=>c.taken=false);
  resetPlayer();
  enemies.forEach((e,i)=>e.x=[720,1260,1840,2460,3050,3660,4270][i]);
  document.getElementById("message").style.display="none";
}
function update(){
  if(gameOver||won)return;
  if(keys.ArrowLeft||keys.a||keys.A){player.vx-=.8;player.dir=-1}
  if(keys.ArrowRight||keys.d||keys.D){player.vx+=.8;player.dir=1}
  player.vx*=.86; player.vx=Math.max(-7,Math.min(7,player.vx));
  const oldY=player.y;
  player.vy+=.75; player.vy=Math.min(18,player.vy);
  player.x+=player.vx; player.y+=player.vy;
  if(player.x<0)player.x=0;
  if(player.x>worldW-player.w)player.x=worldW-player.w;

  player.onGround=false;
  for(const p of platforms){
    if(player.x+player.w>p.x&&player.x<p.x+p.w&&oldY+player.h<=p.y&&player.y+player.h>=p.y&&player.vy>=0){
      player.y=p.y-player.h;player.vy=0;player.onGround=true;
    }
  }
  if(player.y>H+100){loseLife();return}

  for(const c of coinsList){
    if(!c.taken&&Math.hypot(player.x+player.w/2-c.x,player.y+player.h/2-c.y)<42){
      c.taken=true;coins++;score+=100;
    }
  }
  for(const e of enemies){
    e.x+=e.vx;
    if(e.x<e.min||e.x>e.max)e.vx*=-1;
    if(rects(player,e)){
      if(player.vy>3&&player.y+player.h<e.y+25){
        score+=200;e.x=e.min;player.vy=-11;
      }else{loseLife();return}
    }
  }
  if(rects(player,{x:goal.x,y:goal.y,w:45,h:goal.h})){won=true;score+=1000;showMsg("YOU WIN!","Great job, Chinnu! Score: "+score)}
  cameraX=Math.max(0,Math.min(worldW-W,player.x-W*.38));
  document.getElementById("hud").textContent=`❤️ ${lives}   🪙 ${coins}   ⭐ ${score}`;
}
function drawBackground(){
  ctx.fillStyle="#75c9ff";ctx.fillRect(0,0,W,H);
  ctx.fillStyle="#dff5ff";
  for(let i=0;i<9;i++){let x=(i*430-cameraX*.25)%1500; if(x<0)x+=1500;ctx.beginPath();ctx.arc(x,110+(i%3)*35,38,0,Math.PI*2);ctx.arc(x+40,110+(i%3)*35,52,0,Math.PI*2);ctx.arc(x+85,120+(i%3)*35,35,0,Math.PI*2);ctx.fill();}
  ctx.fillStyle="#7bc96f";
  for(let i=0;i<12;i++){let x=(i*430-cameraX*.12)%1400;if(x<0)x+=1400;ctx.beginPath();ctx.arc(x,580,130,Math.PI,Math.PI*2);ctx.fill();}
}
function drawPlatform(p){
  ctx.fillStyle="#75421f";ctx.fillRect(p.x-cameraX,p.y,p.w,p.h);
  ctx.fillStyle="#55b93c";ctx.fillRect(p.x-cameraX,p.y-10,p.w,14);
  ctx.fillStyle="#398a2c";ctx.fillRect(p.x-cameraX,p.y-10,p.w,4);
}
function drawCoin(c){
  if(c.taken)return;
  const x=c.x-cameraX;
  ctx.fillStyle="#ffd43b";ctx.beginPath();ctx.arc(x,c.y,17,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle="#b77900";ctx.lineWidth=4;ctx.stroke();
  ctx.fillStyle="#fff3a1";ctx.font="bold 18px Arial";ctx.textAlign="center";ctx.fillText("★",x,c.y+6);
}
function drawEnemy(e){
  const x=e.x-cameraX,y=e.y;
  ctx.fillStyle="#70451f";ctx.beginPath();ctx.ellipse(x+21,y+25,22,20,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(x+12,y+17,7,0,Math.PI*2);ctx.arc(x+30,y+17,7,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#111";ctx.beginPath();ctx.arc(x+12,y+18,3,0,Math.PI*2);ctx.arc(x+30,y+18,3,0,Math.PI*2);ctx.fill();
}
function drawGoal(){
  const x=goal.x-cameraX;
  ctx.fillStyle="#777";ctx.fillRect(x,goal.y,7,goal.h);
  ctx.fillStyle="#e63946";ctx.beginPath();ctx.moveTo(x+7,goal.y+8);ctx.lineTo(x+70,goal.y+30);ctx.lineTo(x+7,goal.y+52);ctx.closePath();ctx.fill();
}
function drawPlayer(){
  const x=player.x-cameraX,y=player.y;
  ctx.save();
  if(player.dir<0){ctx.translate(x+player.w/2,0);ctx.scale(-1,1);ctx.translate(-player.w/2,0);ctx.drawImage(character,-player.w/2,y,player.w,player.h);}
  else ctx.drawImage(character,x,y,player.w,player.h);
  ctx.restore();
}
function draw(){
  drawBackground();
  ctx.save();ctx.translate(0,0);
  for(const p of platforms)drawPlatform(p);
  for(const c of coinsList)drawCoin(c);
  for(const e of enemies)drawEnemy(e);
  drawGoal();drawPlayer();
  ctx.restore();
}

function bindTouch(id, key){
  const el=document.getElementById(id);
  const start=(e)=>{e.preventDefault(); keys[key]=true;};
  const end=(e)=>{e.preventDefault(); keys[key]=false;};
  ["touchstart","pointerdown"].forEach(ev=>el.addEventListener(ev,start,{passive:false}));
  ["touchend","touchcancel","pointerup","pointerleave"].forEach(ev=>el.addEventListener(ev,end,{passive:false}));
}
bindTouch("leftBtn","ArrowLeft");
bindTouch("rightBtn","ArrowRight");
const jumpBtn=document.getElementById("jumpBtn");
["touchstart","pointerdown"].forEach(ev=>jumpBtn.addEventListener(ev,e=>{e.preventDefault();jump();},{passive:false}));

function loop(){update();draw();requestAnimationFrame(loop)}
character.onload=()=>loop();
</script>
</body>
</html>
